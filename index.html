<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flippy Coins - Infinite Arcade Coin Quest</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-wrapper">
    <!-- Top HUD -->
    <header id="hud">
      <div class="hud-left">
        <div class="badge coin-badge">
          <span class="badge-icon">🪙</span>
          <span id="coin-current">0</span>
        </div>
        <div class="lives-container" id="lives-display">
          <span class="heart active">❤️</span>
          <span class="heart active">❤️</span>
          <span class="heart active">❤️</span>
        </div>
        <div id="shield-indicator" class="badge shield-badge hidden" title="Shield Active">
          <span>🛡️</span>
        </div>
        <div id="magnet-indicator" class="badge magnet-badge hidden" title="Magnet Active">
          <span>🧲</span>
        </div>
      </div>

      <div class="hud-center">
        <div class="badge score-badge">
          <span class="badge-label">SCORE</span>
          <span id="score-display">0</span>
        </div>
      </div>

      <div class="hud-right">
        <div class="badge best-badge">
          <span class="badge-label">BEST</span>
          <span id="hud-high-score">0</span>
        </div>
        <button id="btn-pause" class="icon-btn" aria-label="Pause">⏸️</button>
      </div>
    </header>

    <!-- Canvas viewport -->
    <canvas id="game-canvas"></canvas>

    <!-- Overlay: Start Screen -->
    <div id="screen-start" class="screen-overlay active">
      <div class="card-modal">
        <div class="logo-box">
          <div class="mascot-float">🪙</div>
          <h1 class="game-title">FLIPPY<br><span class="accent">COIN</span></h1>
        </div>
        <p class="tagline">Flap. Dodge. Collect Unlimited Coins!</p>

        <div class="instructions-card">
          <div class="inst-item">
            <span class="inst-icon">👆</span>
            <span><b>Tap / Space</b> to Flap & Fly</span>
          </div>
          <div class="inst-item">
            <span class="inst-icon">🪙</span>
            <span>Collect <b>Unlimited Coins & Gems</b></span>
          </div>
          <div class="inst-item">
            <span class="inst-icon">🧲</span>
            <span>Grab <b>Magnets & Shields</b></span>
          </div>
        </div>

        <button id="btn-play" class="btn-primary pulse">TAP TO FLY ▶</button>
        <div class="high-score-label">BEST SCORE: <span id="start-high-score">0</span></div>
      </div>
    </div>

    <!-- Overlay: Game Over Screen -->
    <div id="screen-game-over" class="screen-overlay">
      <div class="card-modal">
        <div class="mascot-dizzy">💥</div>
        <h2 class="game-over-title">CRASHED!</h2>
        
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-name">FINAL SCORE</span>
            <span id="final-score" class="stat-val">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-name">HIGH SCORE</span>
            <span id="final-high-score" class="stat-val">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-name">COINS IN RUN</span>
            <span id="final-coins-count" class="stat-val">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-name">TOTAL COINS</span>
            <span id="final-total-coins" class="stat-val">0</span>
          </div>
        </div>

        <button id="btn-retry" class="btn-primary pulse">TRY AGAIN 🔁</button>
      </div>
    </div>

    <!-- Overlay: Pause Screen -->
    <div id="screen-pause" class="screen-overlay">
      <div class="card-modal">
        <h2>GAME PAUSED</h2>
        <div class="pause-options">
          <button id="btn-sound-toggle" class="btn-secondary">🔊 SOUND: ON</button>
          <button id="btn-resume" class="btn-primary">RESUME ▶</button>
          <button id="btn-restart" class="btn-secondary">RESTART 🔄</button>
        </div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
